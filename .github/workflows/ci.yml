name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate scripts and profile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate Bash scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          # GQYOS scripts
          bash -n gqyos/bin/gqyos
          bash -n gqyos/bin/gqyos-doctor
          bash -n gqyos/bin/gqyos-logo
          bash -n gqyos/bin/gqyos-migrate
          bash -n gqyos/bin/gqyos-update
          bash -n gqyos/install/install.sh
          # ISO build
          bash -n iso/build-iso.sh
          bash -n iso/profile/airootfs/usr/bin/gqyos-install

      - name: Validate profile structure
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in iso/profile/profiledef.sh iso/profile/packages.x86_64; do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
          done

      - name: Check required project files
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f README.md
          test -f gqyos/version
