name: Build GQYOS ISO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    name: Build ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    timeout-minutes: 60

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm archiso git

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Determine version
        id: version
        run: |
          # 从 gqyos/version 读取版本号
          GQY_VER=$(cat gqyos/version | grep -oE 'v[0-9.]+' | head -1)
          if [[ -z "$GQY_VER" ]]; then
            GQY_VER="v$(date +%Y.%m.%d)-dev"
          fi
          echo "tag=$GQY_VER" >> "$GITHUB_OUTPUT"

      - name: Copy installer and gqyos into profile
        run: |
          mkdir -p iso/profile/airootfs/opt/gqyos
          mkdir -p iso/profile/airootfs/usr/share/gqyos
          mkdir -p iso/profile/airootfs/usr/bin
          # 复制安装器
          cp live-setup/install-arch/install-arch.sh iso/profile/airootfs/opt/gqyos/
          chmod +x iso/profile/airootfs/opt/gqyos/install-arch.sh
          # 复制 gqyos 核心
          cp -r gqyos/bin/* iso/profile/airootfs/usr/bin/ 2>/dev/null || true
          cp -r gqyos/* iso/profile/airootfs/usr/share/gqyos/ 2>/dev/null || true
          cp gqyos/version iso/profile/airootfs/usr/share/gqyos/ 2>/dev/null || true

      - name: Build ISO
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE"
          echo "Profile:"
          ls -la "$GITHUB_WORKSPACE/iso/profile/"
          mkarchiso -v -w "$GITHUB_WORKSPACE/work" -o "$GITHUB_WORKSPACE/out" "$GITHUB_WORKSPACE/iso/profile"

      - name: Generate checksums
        run: |
          ls -la "$GITHUB_WORKSPACE/out/"
          cd "$GITHUB_WORKSPACE/out" || exit 1
          sha256sum *.iso > SHA256SUMS
          cat SHA256SUMS

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: GQYOS-${{ steps.version.outputs.tag }}
          path: |
            ${{ github.workspace }}/out/*.iso
            ${{ github.workspace }}/out/SHA256SUMS
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: GQYOS ${{ steps.version.outputs.tag }}
          body: |
            ## GQYOS ${{ steps.version.outputs.tag }}

            为顾清影而造的 AI 驱动 Arch Linux 系统。

            ### 安装说明
            1. 将 ISO 写入 U盘 (推荐 `dd` 或 Ventoy)
            2. 从 U盘启动
            3. 运行 `sudo gqyos-install`
            4. 按提示完成安装

            ### 校验
            下载 SHA256SUMS 文件验证 ISO 完整性。
          files: |
            ${{ github.workspace }}/out/*.iso
            ${{ github.workspace }}/out/SHA256SUMS
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
