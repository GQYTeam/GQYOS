name: Build GQYOS ISO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (留空自动检测)'
        required: false

permissions:
  contents: write

jobs:
  build-iso:
    name: Build ISO
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(date +%Y.%m.%d)-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Install archiso
        run: |
          sudo pacman -Sy --noconfirm archiso

      - name: Copy installer into profile
        run: |
          mkdir -p iso/profile/airootfs/opt/gqyos
          cp live-setup/install-arch/install-arch.sh iso/profile/airootfs/opt/gqyos/
          chmod +x iso/profile/airootfs/opt/gqyos/install-arch.sh
          # 复制 logo 素材
          mkdir -p iso/profile/airootfs/usr/share/gqyos
          cp asses/gqyos-logo-sunset.ansi iso/profile/airootfs/usr/share/gqyos/ 2>/dev/null || true
          cp asses/GQYOS-logo.png iso/profile/airootfs/usr/share/gqyos/ 2>/dev/null || true
          # 复制文档
          mkdir -p iso/profile/airootfs/opt/gqyos/docs
          cp gqy-arch-setup/README.md iso/profile/airootfs/opt/gqyos/docs/ 2>/dev/null || true

      - name: Build ISO
        run: |
          sudo ./iso/build-iso.sh

      - name: Generate checksums
        run: |
          cd iso/out
          sha256sum *.iso > SHA256SUMS
          cat SHA256SUMS

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: GQYOS-${{ steps.version.outputs.tag }}
          path: |
            iso/out/*.iso
            iso/out/SHA256SUMS
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: GQYOS ${{ steps.version.outputs.tag }}
          body: |
            ## GQYOS ${{ steps.version.outputs.tag }}

            为顾清影而造的 AI 驱动 Arch Linux 系统。

            ### 安装说明
            1. 将 ISO 写入 U盘 (推荐 `dd` 或 Ventoy)
            2. 从 U盘启动
            3. 运行 `sudo gqyos-install`
            4. 按提示完成安装

            ### 校验
            下载 SHA256SUMS 文件验证 ISO 完整性。
          files: |
            iso/out/*.iso
            iso/out/SHA256SUMS
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
